<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFLUX | AI Image Generation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar: Controls -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                    MFLUX
                </div>
            </header>

            <div class="sidebar-content">
                <!-- Prompt -->
                <div class="prompt-container">
                    <textarea id="prompt" placeholder="Describe your imagination..." spellcheck="false"></textarea>
                </div>

                <!-- Settings -->
                <div class="settings-group">

                    <!-- Model Selection -->
                    <div class="form-group">
                        <label>Model</label>
                        <div class="select-wrapper">
                            <select id="model-select">
                                <option>Loading...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Init Image Upload -->
                    <div class="form-group">
                        <label>Init Image (Optional)</label>
                        <div class="file-upload btn btn-secondary" id="upload-btn">
                            <span>Upload Image</span>
                            <input type="file" id="init-image" accept="image/*">
                        </div>
                        <div class="file-status" id="init-image-status">No image selected</div>
                        <button id="delete-img-btn" class="action-btn" style="display:none; margin-top:5px;">Remove</button>
                    </div>

                    <!-- Dimensions -->
                    <div class="form-group">
                        <label>
                            <span>Width</span>
                            <span class="value-display" id="width-value">1024</span>
                        </label>
                        <input type="range" id="width" min="256" max="2048" step="8" value="1024">
                    </div>

                    <div class="form-group">
                        <label>
                            <span>Height</span>
                            <span class="value-display" id="height-value">768</span>
                        </label>
                        <input type="range" id="height" min="256" max="2048" step="8" value="768">
                    </div>

                    <div class="form-group">
                        <label>
                            <span>Aspect Ratio</span>
                            <span class="value-display" id="aspect-ratio">4:3</span>
                        </label>
                    </div>

                    <!-- Advanced Settings -->
                    <div class="form-group">
                        <label>
                            <span>Steps</span>
                            <span class="value-display" id="steps-value">4</span>
                        </label>
                        <input type="range" id="steps" min="1" max="50" value="4">
                    </div>

                    <div class="form-group">
                        <label>
                            <span>Batch Count</span>
                            <span class="value-display" id="count-value">1</span>
                        </label>
                        <input type="range" id="count" min="1" max="8" value="1">
                    </div>

                    <div class="form-group">
                        <label>
                            <span>Quality (JPEG)</span>
                            <span class="value-display" id="quality-value">90</span>
                        </label>
                        <input type="range" id="quality" min="10" max="100" value="90">
                    </div>

                    <div class="form-group">
                        <label>Seed</label>
                        <input type="text" id="seed" placeholder="Random">
                    </div>

                    <!-- Server Config -->
                    <div class="form-group" style="margin-top: 20px; border-top: 1px solid var(--border-subtle); padding-top: 20px;">
                        <label>Server URL</label>
                        <input type="text" id="mflux-server">
                    </div>

                </div>
            </div>

            <footer class="sidebar-footer">
                <button id="generate-btn" class="btn btn-primary">Generate</button>
            </footer>
        </aside>

        <!-- Right: Main Content / Gallery -->
        <main class="main-content">
            <div id="empty-state" class="empty-state">
                <h2>Ready to Create</h2>
                <p>Enter a prompt and hit generate to see the magic happen.</p>
            </div>

            <div id="image-gallery" class="image-gallery">
                <!-- Generated images will be injected here -->
            </div>
        </main>
    </div>

    <!-- Status Bar / Toast -->
    <div id="status-bar" class="status-bar">
        <div class="spinner"></div>
        <span id="status-text">Ready</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
